superType: "base:structured"
form:
# end::header[]
# tag::basics[]
  - type: "TextLine"
    name: "legalName"
    label: "Legal name"
    helpText: "The artist's name on official documents, if different from their stage name."
  - type: "TextArea"
    name: "about"
    label: "About the artist"
# end::basics[]
# tag::birthday[]
  - type: "Date"
    name: "birthday"
    label: "Birthday"
# end::birthday[]
# tag::favoriteAnimal[]
  - type: "ContentSelector"
    name: "favoriteAnimal"
    label: "Favorite animal"
    allowContentType:
      - "animal"
    allowPath:
      - "/animals/*"
# end::favoriteAnimal[]
# tag::filmography[]
  - type: "ItemSet"
    name: "filmography"
    label: "Filmography"
    occurrences:
      min: 0
      max: 0
    items:
      - type: "TextLine"
        name: "title"
        label: "Title"
        occurrences:
          min: 1
          max: 1
      - type: "Long"
        name: "year"
        label: "Year"
        occurrences:
          min: 1
          max: 1
        min: 0
